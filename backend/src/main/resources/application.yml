server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coffee}
    username: ${DB_USER:coffee}
    password: ${DB_PASSWORD:coffee}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: ${APP_TIMEZONE:Europe/Sofia}
  jwt:
    # Минимум 32 символа. В продукция задължително се подава през JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-hours: ${JWT_TTL_HOURS:12}
    # Колко дни важи входът с отметка „Запомни ме“
    remember-days: ${JWT_REMEMBER_DAYS:90}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    display-name: ${ADMIN_DISPLAY_NAME:Администратор}
