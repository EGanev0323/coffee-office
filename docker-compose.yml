services:
  db:
    image: postgres:16-alpine
    ports:
      - "100.64.0.20:5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee}
      POSTGRES_USER: ${POSTGRES_USER:-coffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
      TZ: Europe/Sofia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-coffee}
      DB_USER: ${POSTGRES_USER:-coffee}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Задай JWT_SECRET в .env (поне 32 символа)}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задай ADMIN_PASSWORD в .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Администратор}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Sofia}
    depends_on:
      db:
        condition: service_healthy
    # Бекендът не е изложен навън – достъпен е само през nginx във frontend контейнера.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
